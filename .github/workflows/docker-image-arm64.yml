name: Build And Publish Docker Image (arm64)

on:
  push:
    branches:
      - webdist
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image name
        id: vars
        shell: bash
        run: |
          IMAGE_REPO="${GITHUB_REPOSITORY,,}"
          echo "image=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image from source
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}:webdist-arm64
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}:${{ github.sha }}-arm64
          provenance: false

      - name: Smoke check arm64 runtime
        shell: bash
        run: |
          docker run --rm --platform linux/arm64 \
            --entrypoint java \
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}:webdist-arm64 \
            -version
